<mat-toolbar class="toolbar" role="banner">
  <button mat-icon-button type="button" (click)="toggleSidenav()"
          [attr.aria-label]="'toolbar.toggle-menu' | translate"
          [attr.aria-expanded]="sidenavOpened()">
    <mat-icon>menu</mat-icon>
  </button>
  <img class="logo" src="assets/github-mark.svg" [alt]="'toolbar.logo-alt' | translate" />
  <span class="title">{{ 'toolbar.app-title' | translate }}</span>
  <span class="spacer"></span>
  <app-language-switcher />
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav mode="side" [opened]="sidenavOpened()" role="navigation"
               [attr.aria-label]="'nav.main' | translate">
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
